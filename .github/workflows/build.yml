name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure Android platform folders
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Scaffolding android/ via flutter create…"
            flutter create --project-name novel_reader --org com.novelreader --platforms=android .
          else
            echo "android/ platform already present"
          fi

      - name: Apply AndroidManifest overlay
        run: |
          OVERLAY="android/app/src/main/AndroidManifest.xml.overlay"
          TARGET="android/app/src/main/AndroidManifest.xml"
          if [ -f "$OVERLAY" ]; then
            cp "$OVERLAY" "$TARGET"
            echo "Applied AndroidManifest.xml.overlay → $TARGET"
          else
            # Fallback: ensure INTERNET permission at least.
            if [ -f "$TARGET" ] && ! grep -q 'android.permission.INTERNET' "$TARGET"; then
                # Insert INTERNET and NETWORK_STATE permissions after the <manifest> tag
                awk '
                /<manifest/ && !inserted { print; print "    <uses-permission android:name=\"android.permission.INTERNET\"/>"; print "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>"; inserted=1; next }
                { print }
                ' "$TARGET" > "$TARGET.tmp" && mv "$TARGET.tmp" "$TARGET"
                echo "Injected INTERNET + NETWORK_STATE permissions"
            fi
          fi
          # Ensure the application label is Novel Reader even if overlay was skipped.
          if [ -f "$TARGET" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Novel Reader"/' "$TARGET" || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Patch flutter_inappwebview proguard (CI workaround)
        run: |
          PUB_CACHE="$HOME/.pub-cache/hosted/pub.dev"
          for f in "$PUB_CACHE"/flutter_inappwebview_android-*/android/build.gradle; do
            if [ -f "$f" ]; then
              sed -i "s|getDefaultProguardFile('proguard-android.txt')|getDefaultProguardFile('proguard-android-optimize.txt')|g" "$f" || true
              sed -i "s|getDefaultProguardFile(\"proguard-android.txt\")|getDefaultProguardFile(\"proguard-android-optimize.txt\")|g" "$f" || true
              echo "Patched $f"
            fi
          done

      - name: Patch JNI plugin build.gradle (CI workaround)
        run: |
          PUB_CACHE="$HOME/.pub-cache/hosted/pub.dev"
          f="$PUB_CACHE/jni-1.0.1/android/build.gradle"
          if [ -f "$f" ] && ! grep -q "apply plugin: 'kotlin-android'" "$f"; then
            sed -i "s|apply plugin: 'com.android.library'|apply plugin: 'com.android.library'\napply plugin: 'kotlin-android'|" "$f"
            echo "Patched $f"
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
